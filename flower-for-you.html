<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A flower for you</title>
<style>
:root{--bg1:#2a0418;--bg2:#0d0007;--ink:#ffd9e8;--accent:#ff4f9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;color-scheme:dark}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 75%);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.msg{position:fixed;left:0;right:0;bottom:calc(6% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 24px;opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s ease;pointer-events:none}
.msg.show{opacity:1;transform:none;pointer-events:auto}
h1{font-size:clamp(28px,6vw,48px);font-weight:normal;margin:0 0 8px;letter-spacing:.02em;text-shadow:0 0 24px rgba(255,79,154,.6)}
p{margin:0 0 18px;font-size:clamp(15px,3.6vw,19px);opacity:.85}
button{font:inherit;color:var(--ink);background:rgba(255,79,154,.18);border:1px solid rgba(255,150,200,.5);border-radius:999px;padding:10px 26px;cursor:pointer}
button:hover{background:rgba(255,79,154,.35)}
</style>
</head>
<body>
<canvas id="p"></canvas>
<canvas id="c"></canvas>
<div class="msg" id="msg">
  <h1 id="title">This one is for you</h1>
  <p>Forgot to bring real flowers, so I hand crafted one instead. Here’s a flower for my girl 🌸</p>
  <p>But Tashkir Loves you a lot!</p>
  <button id="again">Watch it bloom again</button>
</div>
<script>
(function(){
var q=new URLSearchParams(location.search).get('to');
if(q){document.getElementById('title').textContent='For '+q.slice(0,40)}
var c=document.getElementById('c'),x=c.getContext('2d');
var pc=document.getElementById('p'),px=pc.getContext('2d');
var W,H,dpr,cx,cy,R,P0,P1,P2,P3,frame,raf;
var LAYERS=80,PETALS=9;
function bez(u){var v=1-u;return{
 x:v*v*v*P0.x+3*v*v*u*P1.x+3*v*u*u*P2.x+u*u*u*P3.x,
 y:v*v*v*P0.y+3*v*v*u*P1.y+3*v*u*u*P2.y+u*u*u*P3.y}}
function setup(){
 dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 [c,pc].forEach(function(e){e.width=W*dpr;e.height=H*dpr});
 x.setTransform(dpr,0,0,dpr,0,0);px.setTransform(dpr,0,0,dpr,0,0);
 R=Math.min(W*0.34,H*0.2);cx=W/2;cy=H*0.34;
 P0={x:cx,y:cy+R*0.85};P1={x:cx-R*0.15,y:cy+R*2.2};
 P2={x:cx+R*0.9,y:H*0.62};P3={x:cx+R*0.35,y:H*0.8};
 x.clearRect(0,0,W,H);frame=0;
 document.getElementById('msg').classList.remove('show');
}
function stemStep(u0,u1){
 x.globalCompositeOperation='source-over';
 x.strokeStyle='rgba(60,200,130,.9)';x.lineWidth=2.2;x.lineCap='round';
 x.beginPath();var a=bez(u0);x.moveTo(a.x,a.y);
 for(var u=u0;u<=u1;u+=0.01){var b=bez(u);x.lineTo(b.x,b.y)}
 x.stroke();
}
function leaf(u,side,size,rot){
 var p=bez(u);
 x.save();x.translate(p.x,p.y);x.rotate(rot);
 x.globalCompositeOperation='lighter';
 for(var i=0;i<9;i++){
  x.strokeStyle='rgba(40,170,100,'+(0.35+i*0.04)+')';x.lineWidth=1.2;
  x.beginPath();
  x.ellipse(side*size*0.55,0,size*(0.55-i*0.04),size*(0.22-i*0.015),0,0,Math.PI*2);
  x.stroke();
 }
 x.restore();
}
function layer(k){
 var f=k/LAYERS;
 var d=R*(0.5*(1-f)+0.1), r=R*(0.4*(1-f)+0.1);
 var hue=330-f*18, light=48+f*38;
 x.globalCompositeOperation='lighter';
 x.strokeStyle='hsla('+hue+',100%,'+light+'%,0.42)';
 x.lineWidth=1.3;
 var off=k*0.23;
 for(var j=0;j<PETALS;j++){
  var a=off+j*Math.PI*2/PETALS;
  x.beginPath();
  x.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d,r,r*0.92,a,0,Math.PI*2);
  x.stroke();
 }
 // soft glow in the middle
 var g=x.createRadialGradient(cx,cy,0,cx,cy,R*0.35);
 g.addColorStop(0,'rgba(255,230,240,'+(0.02+f*0.03)+')');g.addColorStop(1,'rgba(255,230,240,0)');
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*0.35,0,Math.PI*2);x.fill();
}
function tick(){
 if(frame<70){stemStep(Math.max(0,frame-1)/70,frame/70)}
 if(frame===70){leaf(0.55,1,R*0.55,0.5);leaf(0.32,-1,R*0.4,-0.3)}
 if(frame>=70){var k=Math.floor((frame-70)/2);if(k<LAYERS&&(frame%2===0))layer(k);
  if(k>=LAYERS)document.getElementById('msg').classList.add('show')}
 frame++;
}
// falling petals
var ps=[];
for(var i=0;i<28;i++)ps.push({x:Math.random(),y:Math.random(),s:3+Math.random()*5,v:.15+Math.random()*.35,w:Math.random()*6,r:Math.random()*6});
function petals(t){
 px.clearRect(0,0,W,H);
 ps.forEach(function(p){
  p.y+=p.v/400*(H/600);if(p.y>1.05){p.y=-.05;p.x=Math.random()}
  var X=(p.x+Math.sin(t/1500+p.w)*0.03)*W,Y=p.y*H;
  px.save();px.translate(X,Y);px.rotate(p.r+t/1200);
  px.fillStyle='rgba(255,120,175,.35)';
  px.beginPath();px.ellipse(0,0,p.s,p.s*.55,0,0,Math.PI*2);px.fill();px.restore();
 });
}
function loop(t){tick();petals(t);raf=requestAnimationFrame(loop)}
function start(){cancelAnimationFrame(raf);setup();raf=requestAnimationFrame(loop)}
document.getElementById('again').addEventListener('click',start);
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(start,250)});
start();
})();
</script>
</body>
</html>
